server {
    listen 4200;

    root /var/www/board/;
    index index.html;
    charset utf-8;

    server_tokens off;

    # Заголовки безопасности (применяются глобально; в location с own add_header — повторяются)
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "DENY"                             always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    add_header X-Robots-Tag            "noindex, nofollow"                always;

    # 404 → SPA (не показывать стандартную страницу nginx)
    error_page 404 /index.html;

    # index.html — без кэша (балансер и браузер всегда получат свежую версию)
    location = /index.html {
        add_header Cache-Control       "no-store"                         always;
        add_header X-Content-Type-Options  "nosniff"                      always;
        add_header X-Frame-Options         "DENY"                         always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header X-Robots-Tag            "noindex, nofollow"            always;
    }

    # Статические ассеты (Angular добавляет хеш в имя файла → safe immutable cache)
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control           "public, immutable"            always;
        add_header X-Content-Type-Options  "nosniff"                      always;
        add_header X-Frame-Options         "DENY"                         always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header X-Robots-Tag            "noindex, nofollow"            always;
        access_log off;
    }

    # SPA-роутинг
    location / {
        try_files $uri $uri/ /index.html;

        limit_except GET HEAD OPTIONS {
            deny all;
        }
    }

    # Запрет доступа к скрытым файлам и служебным путям
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }
}
