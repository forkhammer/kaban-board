<div class="search-page">
  <div class="search-header" *ngIf="searchQuery">
    <h5 class="search-title">Результаты поиска:</h5>
    <span *ngIf="searchQuery" class="search-query">{{ searchQuery }}</span>
  </div>

  <div class="search-results" *ngIf="searchQuery">
    <app-issue-table [search]="searchQuery"></app-issue-table>
  </div>

  <div class="empty-search" *ngIf="!searchQuery">
    Нет результатов для поиска
  </div>
</div>
