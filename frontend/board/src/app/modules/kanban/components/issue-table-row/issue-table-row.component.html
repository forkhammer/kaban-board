<ng-container [formGroup]="form">
  <td class="column">
    <span class="drag-handle" cdkDragHandle>
      <fa-icon [icon]="faGripVertical"></fa-icon>
    </span>
  </td>
  <td class="column">
    <div class="project">
      <a [href]="issue.webUrl" target="_blank" *ngIf="issue.webUrl">
        <fa-icon [icon]="faArrowUpRightFromSquare"></fa-icon>
        {{issue.projectName}}#{{issue.iid}}
      </a>
    </div>
    <span *ngIf="!canManage() || issue.webUrl">{{issue.title}}</span>
    <div #titleEl contenteditable="true" class="title-edit"
      *ngIf="canManage() && !issue.webUrl"
      (input)="onTitleInput($event)"
      (keydown.enter)="$event.preventDefault()"></div>
  </td>
  <td class="column">
    <div class="assignee" *ngIf="!canManage()">
      <div class="avatar" *ngIf="issue.assignee?.avatar_url">
        <img [src]="issue.assignee?.avatar_url">
      </div>
      <div class="empty-avatar" *ngIf="!issue.assignee?.avatar_url">
        <fa-icon [icon]="faUser"></fa-icon>
      </div>
      <div class="name">{{issue.assignee?.name}}</div>
    </div>

    <app-assignee-select class="flat" formControlName="assignee" [useSearch]="true" [useClear]="true"
      [formatter]="userService.formatter" [itemFormatter]="userService.formatter"
      [valueModel]="issue.assignee"
      [filter]="assigneeFilter"
      *ngIf="canManage()"></app-assignee-select>
  </td>
  <td class="column">
    <div class="epic" *ngIf="!canUpdate()">
      {{issue.epic?.title}}
    </div>

    <app-select-model class="flat" formControlName="epic" [service]="epicService" [useSearch]="true" [useClear]="true"
      [filter]="{project: issue.projectId}"
      [valueModel]="issue.epic"
      *ngIf="canUpdate()"></app-select-model>
  </td>
  <td class="column">
    <div class="release" *ngIf="!canUpdate()">
      {{issue.release?.title}}
    </div>

    <app-select-model class="flat" formControlName="release" [service]="releaseService" [useSearch]="true" [useClear]="true"
      [filter]="{project: issue.projectId}"
      [valueModel]="issue.release"
      *ngIf="canUpdate()"></app-select-model>
  </td>
  <td class="column">
    <app-priority-badge [priority]="issue.priority" *ngIf="issue.priority && !canUpdate()"></app-priority-badge>

    <app-priority-select class="flat" formControlName="priority" *ngIf="canUpdate()" [useClear]="true"></app-priority-select>
  </td>
  <td class="column">
    <span *ngIf="issue.estimateDev && !canUpdate()">{{issue.estimateDev}} ч.</span>

    <app-select-estimate class="flat" formControlName="estimateDev" *ngIf="canUpdate()"></app-select-estimate>
  </td>
  <td class="column">
    <span *ngIf="issue.estimateQA && !canUpdate()">{{issue.estimateQA}} ч.</span>

    <app-select-estimate class="flat" formControlName="estimateQA" *ngIf="canUpdate()"></app-select-estimate>
  </td>
  <td class="column">
    <div class="status" *ngIf="issue.bindStatus && !canUpdate()">{{BIND_STATUS_LABELS[issue.bindStatus]}}</div>

    <app-binding-status-select class="flat" formControlName="bindStatus" *ngIf="canUpdate()"></app-binding-status-select>
  </td>
  <td class="column">
    <div class="comment" *ngIf="issue.comment && !canUpdate()">{{issue.comment}}</div>

    <div #commentEl contenteditable="true" class="comment-edit"
      *ngIf="canUpdate()"
      (input)="onCommentInput($event)"
      (keydown.enter)="$event.preventDefault()"></div>
  </td>
  <td class="column">
    <div ngbDropdown *ngIf="canManage()">
      <button class="btn btn-row-actions" ngbDropdownToggle>
        <fa-icon [icon]="faEllipsisVertical"></fa-icon>
      </button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="unbindIssue()">Удалить</button>
      </div>
    </div>
  </td>
</ng-container>
