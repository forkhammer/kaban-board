<ng-container [formGroup]="form">
  <td class="column project">
    {{issue.projectName}}
  </td>
  <td class="column">
    {{issue.title}}
  </td>
  <td class="column">
    <app-assignee-select formControlName="assignee" [useSearch]="true" [useClear]="true"
      [formatter]="userService.formatter" [itemFormatter]="userService.formatter"
      [valueModel]="issue.assignee"></app-assignee-select>
  </td>
  <td class="column">
    <app-select-model class="flat" formControlName="epic" [service]="epicService" [useSearch]="true" [useClear]="true"
      [filter]="{project: issue.projectId}"
      [valueModel]="issue.epic"></app-select-model>
  </td>
  <td class="column">
    <app-select-model class="flat" formControlName="release" [service]="releaseService" [useSearch]="true" [useClear]="true"
      [filter]="{project: issue.projectId}"
      [valueModel]="issue.release"></app-select-model>
  </td>
  <td class="column">
    <app-select class="flat" formControlName="priority" [values]="ISSUE_PRIORITY_VALUES"></app-select>
  </td>
  <td class="column">
    <app-select-estimate class="flat" formControlName="estimateDev"></app-select-estimate>
  </td>
  <td class="column">
    <app-select-estimate class="flat" formControlName="estimateQA"></app-select-estimate>
  </td>
  <td class="column">
    <app-select class="flat" [values]="BIND_STATUS_VALUES" formControlName="bindStatus"></app-select>
  </td>
  <td class="column">
    <textarea rows="1" formControlName="comment" class="form-control"></textarea>
  </td>
  <td class="column">
    <div ngbDropdown>
      <button class="btn" ngbDropdownToggle>...</button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="unbindIssue()">Удалить</button>
      </div>
    </div>
  </td>
</ng-container>
