<ng-container [formGroup]="form">
  <td class="column project">
    {{issue.projectName}}
  </td>
  <td class="column">
    {{issue.title}}
  </td>
  <td class="column">
    <app-select-model [service]="userService" formControlName="assignee" [useSearch]="true" [useClear]="true"
      [formatter]="userService.formatter" [itemFormatter]="userService.formatter"></app-select-model>
  </td>
  <td class="column">&nbsp;</td>
  <td class="column">
    {{issue.milestone?.title}}
  </td>
  <td class="column">&nbsp;</td>
  <td class="column">
    <app-select-estimate formControlName="estimateDev"></app-select-estimate>
  </td>
  <td class="column">
    <app-select-estimate formControlName="estimateQA"></app-select-estimate>
  </td>
  <td class="column">
    <app-select [values]="BIND_STATUS_VALUES" formControlName="bindStatus"></app-select>
  </td>
  <td class="column">
    <textarea rows="1" formControlName="comment" class="form-control"></textarea>
  </td>
  <td class="column">
    <div ngbDropdown>
      <button class="btn btn-outline-secondary" ngbDropdownToggle>...</button>
      <div ngbDropdownMenu>
        <button ngbDropdownItem (click)="unbindIssue()">Удалить</button>
      </div>
    </div>
  </td>
</ng-container>
