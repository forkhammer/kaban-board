<table class="issue-table">
  <thead>
    <tr>
      <th class="column">Проект</th>
      <th class="column">Задача</th>
      <th class="column">Исполнитель</th>
      <th class="column">Эпик</th>
      <th class="column">Релиз</th>
      <th class="column">Приоритет</th>
      <th class="column">Оценка разработки</th>
      <th class="column">Оценка тестирования</th>
      <th class="column">Статус</th>
      <th class="column">Комментарий</th>
      <th class="column">&nbsp;</th>
    </tr>
  </thead>
  <tbody>
    <tr app-issue-table-row *ngFor="let issue of issues; trackBy: trackByIssue" [issue]="issue" (unbind)="unbindIssue($event)"></tr>
    <tr *ngIf="sprint$ | async">
      <td colspan="11">

        <button class="btn-append" (click)="appendIssue()">
          <fa-icon [icon]="faPlus" class="me-1"></fa-icon>
          <span>Добавить задачу</span>
        </button>

        <app-issue-table-append-row *ngFor="let issue of appendedIssues; let i = index" (issue)="bindIssue($event)"
          [sprint]="(sprint$ | async)!"
          [index]="i"></app-issue-table-append-row>
      </td>
    </tr>
  </tbody>
</table>
