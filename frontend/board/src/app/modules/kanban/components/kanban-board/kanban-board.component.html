<div class="board">
  <app-spinner [visible]="isLoading"></app-spinner>

  <div class="teams">
    <button class="team" *ngFor="let team of (teams$ | async)" [ngbTooltip]="team.title" ngbTooltipPlacement="right" (click)="selectTeam(team)"
      [class.active]="team.id === selectedTeam?.id">
      {{getTeamTitle(team)}}
    </button>
  </div>

  <div class="workarea">
    <div class="user-list" *ngIf="users.length > 0">
      <!-- <div class="filter p-2" [formGroup]="filterForm">
        <app-select-model [service]="teamService" [useClear]="true" formControlName="team"
                          nullTitle="Все"></app-select-model>
      </div> -->

      <!-- <form class="user-search d-flex" [formGroup]="searchForm">
        <input type="text" class="search-input form-control flex-grow-1" formControlName="search" placeholder="Найти...">
        <button class="search-clear btn"><fa-icon [icon]="faXmark" (click)="clearSearch($event)"></fa-icon></button>
      </form> -->

      <button class="user-list__team-link" (click)="goToTeamBoard()"
        [class.active]="!selectedUser">
        <span>Все задачи {{selectedTeam?.title}}</span>
        <fa-icon [icon]="faArrowRight"></fa-icon>
      </button>


      <div class="user-list__content">
        <div class="user-list__scroll">
          <ng-container [ngTemplateOutlet]="userGroupTpl" [ngTemplateOutletContext]="{
            users: users | filterUsersByGroup: null | filterUsersByTeam: (teamId$ | async) | searchUsers:searchForm.get('search')?.value,
            group: otherGroup,
            open: false
            }"></ng-container>

          <div *ngFor="let group of selectedTeam?.groups">
            <ng-container [ngTemplateOutlet]="userGroupTpl" [ngTemplateOutletContext]="{
              users: users | filterUsersByGroup: group.id | filterUsersByTeam: (teamId$ | async) | searchUsers:searchForm.get('search')?.value,
              group: group,
              open: true
              }"></ng-container>
            </div>
        </div>
      </div>

    </div>

    <div class="content">
      <div class="board-header" [formGroup]="filterForm">
        <div class="btn-group me-3">
          <button class="btn" (click)="viewBoard()"
            [class.btn-primary]="view === KanbanView.BOARD">
            <fa-icon [icon]="faTableColumns"></fa-icon>
            Доска
          </button>
          <button class="btn" (click)="viewList()"
            [class.btn-primary]="view === KanbanView.LIST">
            <fa-icon [icon]="faTableList"></fa-icon>
            Список
          </button>
        </div>

        <app-sprint-select formControlName="sprint" [useClear]="true" title="Спринт"
          [filter]="sprintFilter"
          class="me-1 sprint-select" #sprintSelect></app-sprint-select>

        <button class="btn me-3" *ngIf="accountService.isAdmin$ | async" (click)="addSprint()" ngbTooltip="Добавить спринт">
          <fa-icon [icon]="faPlus"></fa-icon>
        </button>

        <ng-container *ngIf="sprintStats$ | async as stats">
          <div class="sprint-stats ms-3 me-auto">
            <div class="sprint-stats__item" ngbTooltip="Вместимость спринта">
              <span class="sprint-stats__label">Вместимость</span>
              <span class="sprint-stats__value">{{ stats.capacity }}</span>
            </div>
            <div class="sprint-stats__item" ngbTooltip="Запланировано Dev / QA">
              <span class="sprint-stats__label">План</span>
              <span class="sprint-stats__value">{{ stats.planned_dev }} / {{ stats.planned_qa }}</span>
            </div>
            <div class="sprint-stats__item" ngbTooltip="Выполнено Dev / QA">
              <span class="sprint-stats__label">Выполнено</span>
              <span class="sprint-stats__value">{{ stats.velocity_dev }} / {{ stats.velocity_qa }}</span>
            </div>
          </div>
        </ng-container>

        <ng-container *ngIf="(sprintId$ | async)">
          <ng-container *ngIf="urls.getSprintBurndownUrl((sprintId$ | async)!) as nav">
            <a [routerLink]="nav.url" [queryParams]="nav.query" class="btn btn-outline-secondary ms-auto me-2" ngbTooltip="Burndown Chart">
              <fa-icon [icon]="faArrowTrendDown"></fa-icon>
            </a>
          </ng-container>

          <ng-container *ngIf="urls.getSprintBurnupUrl((sprintId$ | async)!) as nav">
            <a [routerLink]="nav.url" [queryParams]="nav.query" class="btn btn-outline-secondary me-2" ngbTooltip="Burnup Chart">
              <fa-icon [icon]="faArrowTrendUp"></fa-icon>
            </a>
          </ng-container>
        </ng-container>
      </div>

      <div class="position-relative flex-grow-1">
        <ng-container [ngSwitch]="view">
          <app-user-board *ngSwitchCase="KanbanView.BOARD"
            [user]="selectedUser"
            [team]="selectedTeam"
            [sprint]="selectedSprint"></app-user-board>

          <app-issue-table *ngSwitchCase="KanbanView.LIST"
            [user]="selectedUser"
            [team]="selectedTeam"
            [sprint]="selectedSprint"></app-issue-table>
        </ng-container>
      </div>
    </div>

  </div>
</div>



<ng-template let-users="users" let-group="group" let-open="open" #userGroupTpl>
  <ng-container *ngIf="users.length > 0">
    <app-user-group-card [group]="group" [userCount]="users.length" [isOpen]="open">
      <app-user-card [user]="user" *ngFor="let user of users; trackBy trackByUser"
        (click)="goToUserBoard(user)"
        [selected]="selectedUser === user"></app-user-card>
    </app-user-group-card>
  </ng-container>
</ng-template>
