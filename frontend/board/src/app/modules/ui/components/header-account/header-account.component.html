<div class="d-flex align-items-center">
  <div ngbDropdown placement="bottom-end" *ngIf="account">
    <button ngbDropdownToggle class="fw-medium btn btn-link btn-user">
      <span class="avatar" *ngIf="account.avatarUrl">
        <img [src]="account.avatarUrl">
      </span>
      <fa-icon [icon]="faUser" class="user-icon" *ngIf="!account.avatarUrl"></fa-icon>
      <span class="username">{{account.username}}</span>
    </button>
    <div ngbDropdownMenu class="light">
      <a routerLink="/" ngbDropdownItem (click)="openSettings()">Настройки</a>
      <button ngbDropdownItem (click)="logout()">Выйти</button>
    </div>
  </div>

  <button class="btn btn-primary" *ngIf="!account" routerLink="/auth">Войти</button>

  <button class="btn btn-link" *ngIf="accountService.isAdmin$ | async" (click)="toggleSettings()">
    <fa-icon [icon]="faGear" *ngIf="!(settingsService.isOpen$ | async)"></fa-icon>
    <fa-icon [icon]="faXmark" *ngIf="settingsService.isOpen$ | async"></fa-icon>
  </button>
</div>
